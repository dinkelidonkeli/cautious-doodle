<html>
	<head>
		<title>News - Cautious Doodle</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<link rel="icon" type="image/gif" href="images/icons8-eight-48.png" />
		<style>
			#news-main {
				position: relative;
				z-index: 3;
				max-width: 60rem;
				margin: 0 auto;
				padding: 4rem 2rem 3rem;
			}

			#news-main h2.major {
				text-align: center;
				margin-bottom: 2rem;
			}

			.news-grid {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: 1.5rem;
			}

			.news-card {
				background-color: rgba(27, 31, 34, 0.85);
				border-radius: 4px;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}

			.news-img {
				width: 100%;
				aspect-ratio: 16 / 9;
				overflow: hidden;
			}

			.news-img img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}

			.news-body {
				padding: 1.75rem 1.75rem 1.5rem;
			}

			.news-card .news-date {
				display: block;
				font-size: 0.8rem;
				letter-spacing: 0.1rem;
				text-transform: uppercase;
				color: rgba(255, 255, 255, 0.5);
				margin-bottom: 0.5rem;
			}

			.news-card h3 {
				margin-bottom: 0.5rem;
			}

			.news-card p {
				margin: 0;
				color: rgba(255, 255, 255, 0.75);
			}

			@media screen and (max-width: 736px) {
				.news-grid {
					grid-template-columns: 1fr;
				}

				#news-main {
					padding: 3.5rem 1.25rem 2rem;
				}
			}
		</style>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header">
						<div class="logo">
							<span class="icon fa-gem"></span>
						</div>
						<div class="content">
							<div class="inner">
								<h1>Cautious Doodle</h1>
								<p>A place for mysterious quizzes</p>
							</div>
						</div>
						<nav>
							<ul>
								<li><a href="index.html">Home</a></li>
								<li><a href="ajankohtaista.html">News</a></li>
							</ul>
						</nav>
					</header>

				<!-- News -->
					<div id="news-main">
						<h2 class="major">News</h2>
						<div class="news-grid" id="newsGrid">
							<p id="newsLoading" style="color: rgba(255,255,255,0.5);">Loading news…</p>
						</div>
					</div>

				<!-- Footer -->
					<footer id="footer">
						<p class="copyright">&copy; Cautious Doodle. Design: <a href="https://html5up.net">HTML5 UP</a>.</p>
					</footer>

			</div>

		<!-- BG -->
			<div id="bg"></div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
			<script>
				(async function loadNews() {
					const grid = document.getElementById('newsGrid');
					const loading = document.getElementById('newsLoading');
					try {
						const response = await fetch('assets/data/news.json');
						if (!response.ok) throw new Error('HTTP ' + response.status);
						const items = await response.json();

						if (!Array.isArray(items) || items.length === 0) {
							loading.textContent = 'No news yet.';
							return;
						}

						grid.innerHTML = items.map(function(item) {
							var img = item.image
								? '<div class="news-img"><img src="' + escapeHtml(item.image) + '" alt="" loading="lazy"></div>'
								: '';
							return '<div class="news-card">' +
								img +
								'<div class="news-body">' +
								'<span class="news-date">' + escapeHtml(item.label || 'Update') + '</span>' +
								'<h3>' + escapeHtml(item.title || '') + '</h3>' +
								'<p>' + escapeHtml(item.body || '') + '</p>' +
								'</div>' +
								'</div>';
						}).join('');
					} catch (err) {
						console.error('Failed to load news:', err);
						loading.textContent = 'Could not load news right now.';
					}
				})();

				function escapeHtml(str) {
					return String(str)
						.replace(/&/g, '&amp;')
						.replace(/</g, '&lt;')
						.replace(/>/g, '&gt;')
						.replace(/"/g, '&quot;');
				}
			</script>
	</body>
</html>
